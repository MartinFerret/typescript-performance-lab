<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeScript Performance Lab</title>
<meta name="description" content="Reproducible experiments on TypeScript type-checking performance, by Martin Ferret.">
<meta name="theme-color" content="#f7f9fb">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Geist:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Same design language as martinferret.dev: tokens, blue hero panel, cards, badges, charts. Light only. */
:root {
  --paper: #f7f9fb; --sheet: #ffffff; --fill: #edf1f5; --rule: #d5dde7; --rule-strong: #aab6c5;
  --ink: #0e1726; --ink-2: #2b3546; --muted: #4a576b;
  --accent: #1d5fb8; --accent-strong: #174d96; --accent-tint: #e6eefa;
  --st-merged: #13703a; --st-merged-bg: #e3f4e8;
  --st-discussion: #2b3546; --st-discussion-bg: #edf1f5;
  --st-closed: #4a576b;
  --c-blue: #1d5fb8; --c-blue-mid: #5b8fd9; --c-sky: #e6eefa; --c-sky-strong: #c4d8f5;
  --c-mint: #24875a; --c-coral: #d9482c; --c-coral-ink: #a3321b; --c-coral-soft: #ffe6df;
  --c-violet: #7b5cd6; --c-amber-ink: #7a4a00; --c-sun: #ffd166; --c-sun-soft: #fff4d6; --c-ink: #0e1726;

  --font-display: "Funnel Display", "Geist", system-ui, sans-serif;
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --step--2: 0.875rem; --step--1: 0.9375rem; --step-0: 1.0625rem; --step-1: 1.25rem; --step-2: 1.5rem;
  --step-5: 3.25rem; --step-6: 4.25rem;
  --fs-h1: clamp(2.25rem, 1.5rem + 2.6vw, 3.75rem);
  --fs-h2: clamp(1.625rem, 1.3rem + 1.1vw, 2.25rem);
  --measure: 68ch;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px; --s8: 64px;
  --content: 1120px; --gutter: clamp(16px, 4vw, 40px); --header-h: 64px;
  --r-ctl: 8px;
  --sec-y: clamp(64px, 8vw, 112px); --frame: clamp(8px, 1.5vw, 20px); --r-frame: clamp(24px, 3vw, 40px);
  --card-pad: clamp(20px, 2.2vw, 32px); --grid-gap: clamp(16px, 2vw, 24px); --head-gap: clamp(32px, 4vw, 48px);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 140ms; --t-med: 240ms;
  color-scheme: light;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 16px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: var(--step-0); line-height: 1.6; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
p { margin: 0; text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 500; color: var(--ink); text-wrap: balance; overflow-wrap: break-word; }
h2 { font-size: var(--fs-h2); letter-spacing: -0.02em; line-height: 1.12; }
h3 { font-size: var(--step-1); letter-spacing: -0.01em; line-height: 1.3; }
code, .ver { font-family: var(--font-mono); font-size: 0.86em; }
a { color: inherit; text-decoration: none; }
.link { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 0.2em; text-decoration-thickness: 1px; transition: color var(--t-fast), text-decoration-color var(--t-fast); }
.link:hover { color: var(--accent); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
main:focus { outline: none; }
::selection { background: var(--accent-tint); color: var(--ink); }
.wrap { max-width: var(--content); margin: 0 auto; padding-inline: var(--gutter); }
.block { padding-block: calc(var(--sec-y) / 2); }
.frame { position: relative; margin: calc(var(--sec-y) / 2) var(--frame); border-radius: var(--r-frame); padding-block: var(--sec-y); overflow: hidden; }
.cluster { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.meta { font-size: var(--step--1); color: var(--muted); }
.read { line-height: 1.65; max-width: var(--measure); color: var(--ink-2); }
.read code, .kcard-text code, .facts code, .plain code, .zig-verdict code { background: var(--fill); border-radius: 5px; padding: 1px 5px; }
.hero-sub code { background: rgba(255, 255, 255, 0.16); color: #fff; border-radius: 5px; padding: 1px 5px; }
.skip { position: absolute; left: var(--s2); top: -100px; z-index: 100; background: var(--ink); color: var(--paper); padding: var(--s1) var(--s2); border-radius: var(--r-ctl); }
.skip:focus { top: var(--s2); }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--rule); }
.header-inner { max-width: var(--content); margin: 0 auto; padding: 0 var(--gutter); min-height: var(--header-h); display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s2); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-height: var(--header-h); font-family: var(--font-display); font-weight: 500; font-size: var(--step-1); letter-spacing: -0.01em; line-height: 1; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--c-blue); color: #fff; font-family: var(--font-ui); font-size: 13px; font-weight: 700; letter-spacing: -0.02em; }
.nav { list-style: none; display: flex; gap: 4px; }
.nav a { position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: var(--step--1); font-weight: 500; color: var(--ink-2); border-radius: var(--r-ctl); white-space: nowrap; transition: color var(--t-fast), background-color var(--t-fast); }
.nav a:hover { color: var(--ink); background: var(--fill); }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -10px; height: 2px; border-radius: 2px; background: var(--accent); }
.gh { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--sheet); font-size: var(--step--1); font-weight: 500; color: var(--ink-2); transition: border-color var(--t-fast), color var(--t-fast); }
.gh:hover { border-color: var(--rule-strong); color: var(--ink); }
.gh svg { width: 18px; height: 18px; }
@media (max-width: 860px) {
  .nav { order: 3; width: calc(100% + 2 * var(--gutter)); margin: 0 calc(-1 * var(--gutter)); padding: 0 calc(var(--gutter) - 12px) 6px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--rule); }
  .nav a[aria-current="page"]::after { bottom: 4px; }
}

/* ---------- CTAs ---------- */
.cta { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 14px; font-family: var(--font-ui); font-weight: 600; font-size: var(--step-0); line-height: 1; border: 2px solid transparent; white-space: nowrap; cursor: pointer; transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease), background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast); }
.cta svg { width: 20px; height: 20px; transition: transform var(--t-med) var(--ease); }
.cta:hover { transform: translateY(-2px); }
.cta:hover svg { transform: translateX(4px); }
.cta:active { transform: translateY(0); }
.cta--primary { background: var(--c-blue); color: #fff; box-shadow: 0 10px 24px -10px rgba(29, 95, 184, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
.cta--primary:hover { background: var(--accent-strong); }
.cta--soft { background: var(--c-sun); color: var(--c-ink); box-shadow: 0 10px 24px -14px rgba(180, 120, 0, 0.8); }
.cta--soft:hover { background: #ffc53d; }
.cta--outline { background: var(--sheet); color: var(--c-ink); border-color: var(--c-ink); }
.cta--outline:hover { background: var(--c-ink); color: #fff; }
.cta--onblue { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.7); }
.cta--onblue:hover { background: rgba(255, 255, 255, 0.12); border-color: #fff; }

/* ---------- Hero ---------- */
.hero-panel { margin-top: var(--frame); padding-block: 0; color: #fff; background: radial-gradient(circle at 78% 45%, #3a80d8 0%, transparent 42%), linear-gradient(135deg, #2366c2, #1d5fb8 45%, #174d96); }
.hero-panel::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.18; background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse at 20% 30%, #000, transparent 60%); -webkit-mask-image: radial-gradient(ellipse at 20% 30%, #000, transparent 60%); }
.hero-panel :focus-visible { outline-color: var(--c-sun); }
.hero { position: relative; display: grid; gap: var(--head-gap); align-items: center; padding-block: calc(var(--sec-y) * 0.8); }
.hero-text { display: grid; gap: var(--s3); min-width: 0; }
.hero-crumb { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: var(--step--1); font-weight: 600; color: #e3ecf9; }
.hero-crumb a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, 0.5); text-underline-offset: 0.2em; }
.hero-title { color: #fff; font-size: clamp(2.5rem, 1.6rem + 2.6vw, 3.75rem); line-height: 1.02; letter-spacing: -0.045em; max-width: 18ch; }
.hero-sub { font-size: var(--step-1); line-height: 1.55; color: #e3ecf9; max-width: 46ch; }
.hero-actions { gap: 14px; }
.hero-fig { min-width: 0; padding: var(--card-pad); border-radius: 24px; background: var(--sheet); color: var(--ink); box-shadow: 0 40px 80px -36px rgba(8, 30, 70, 0.75); }
@media (min-width: 960px) { .hero:not(.hero--solo) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s8); } }
.lab-fig { display: grid; gap: var(--s2); }
.lab-fig-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.lab-fig-cap b { font-family: var(--font-display); font-weight: 500; font-size: var(--step-2); }
.lab-fig-cap span { font-size: var(--step--1); color: var(--muted); }
.lab-fig ul { list-style: none; display: grid; gap: 12px; }
.lab-fig a { display: grid; gap: 6px; padding: 16px 18px; border-radius: 16px; background: var(--c-sky); transition: transform var(--t-med) var(--ease), background-color var(--t-fast); }
.lab-fig a:hover { transform: translateX(4px); background: var(--c-sky-strong); }
.lf-top, .res-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lf-num { font-family: var(--font-display); font-size: var(--step-5); line-height: 1; letter-spacing: -0.045em; color: var(--c-blue); }
.lf-label { font-size: var(--step--1); color: var(--ink-2); }
.res { display: grid; gap: 10px; }
.res-num { font-family: var(--font-display); font-size: clamp(3.5rem, 2rem + 4vw, 5.5rem); line-height: 1; letter-spacing: -0.05em; color: var(--c-blue); }
.res-label { font-size: var(--step-1); color: var(--ink); }
.res-meta { font-size: var(--step--1); color: var(--muted); padding-top: 10px; border-top: 1px solid var(--rule); }

/* ---------- Overview hero: a replay of the measured check, file by file ---------- */
.hx { align-items: center; padding-block: calc(var(--sec-y) * 0.85); }
.hx .hero-text { gap: var(--s3); }
.hx .hero-title { position: relative; z-index: 0; font-size: clamp(2.5rem, 1.6rem + 2.8vw, 4rem); line-height: 1.02; letter-spacing: -0.045em; max-width: 12ch; }
.hx .hero-sub { max-width: 36ch; }
.hx-word { display: inline-block; }
.js .hx-word { opacity: 0; transform: translateY(0.4em); filter: blur(4px); animation: word 0.8s var(--ease-out) forwards; animation-delay: calc(100ms + var(--w) * 80ms); }
@keyframes word { to { opacity: 1; transform: none; filter: none; } }
.hx-mark { position: relative; white-space: nowrap; }
.hx-mark::after { content: ""; position: absolute; left: 0; right: 0.12em; bottom: 0.02em; height: 0.09em; border-radius: 0.1em; background: var(--c-sun); z-index: -1; transform-origin: left; }
.js .hx-mark::after { transform: scaleX(0); animation: sweep 0.7s var(--ease-out) 0.8s forwards; }
@keyframes sweep { to { transform: scaleX(1); } }
@media (min-width: 960px) { .hx { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s8); } }

.tw { position: relative; justify-self: stretch; width: 100%; max-width: 500px; margin: 0; display: grid; gap: 18px; padding: 22px 24px 20px; border-radius: 24px; background: var(--sheet); color: var(--ink); box-shadow: 0 40px 80px -36px rgba(8, 30, 70, 0.75); }
@media (min-width: 960px) { .tw { justify-self: end; } }
.js .tw { animation: rise 0.9s var(--ease-out) 0.2s both; }
.tw-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tw-top p { font-size: var(--step--2); color: var(--muted); }
.tw-top p b { display: block; font-family: var(--font-display); font-weight: 500; font-size: var(--step-1); line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 2px; }
.tw-replay { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--muted); cursor: pointer; transition: color var(--t-fast), border-color var(--t-fast), transform var(--t-med) var(--ease); }
.tw-replay:hover { color: var(--accent); border-color: var(--rule-strong); transform: rotate(-40deg); }
.tw-replay svg { width: 16px; height: 16px; }
.run { display: grid; gap: 8px; }
.run-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: var(--step--1); }
.run-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-2); }
.run-name .ver { font-weight: 500; color: var(--muted); }
.run-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cell); }
.run[data-state="running"] .run-dot { animation: blink 0.9s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.run-time { font-family: var(--font-mono); font-size: var(--step--1); font-weight: 600; color: var(--ink); }
.run[data-state="done"] .run-time { color: var(--done-ink); }
.files { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 2px; }
.files i { aspect-ratio: 1; border-radius: 1.5px; background: var(--fill); transition: background-color 0.45s ease; }
.files i.on { background: var(--cell); }
.files i.hot { background: var(--c-sun); box-shadow: 0 0 6px 1px rgba(255, 196, 61, 0.8); transition: none; }
.run--slow { --cell: #8db3ea; --done-ink: var(--ink-2); }
.run--fast { --cell: var(--c-blue); --done-ink: var(--st-merged); }
.run-meta { font-size: 0.8125rem; color: var(--muted); }
.tw-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
.tw-foot p { font-size: 0.8125rem; line-height: 1.45; color: var(--muted); max-width: 32ch; }
.tw-foot a { color: var(--ink-2); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 0.2em; }
.tw-foot a:hover { color: var(--accent); }
.tw-x { flex: none; display: inline-flex; align-items: baseline; gap: 6px; color: var(--c-blue); opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.6s var(--ease-out); }
.tw-x b { font-family: var(--font-display); font-weight: 500; font-size: 2.5rem; line-height: 0.9; letter-spacing: -0.05em; }
.tw-x span { font-size: var(--step--1); font-weight: 600; color: var(--ink-2); }
.tw[data-finished] .tw-x { opacity: 1; transform: none; }
@media (max-width: 560px) { .tw { padding: 18px 16px; } .tw-foot { flex-direction: column-reverse; align-items: flex-start; } }
@media (prefers-reduced-motion: reduce) {
  .js .hx-word { opacity: 1 !important; transform: none !important; filter: none !important; }
  .js .hx-mark::after { transform: none !important; }
}

/* ---------- Tags and badges ---------- */
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: var(--step--1); font-weight: 600; line-height: 1; color: var(--ink-2); }
.tag-ic { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: #fff; background: var(--t); box-shadow: 0 4px 10px -4px var(--t); }
.tag-ic svg { width: 16px; height: 16px; }
.tag--violet { --t: var(--c-violet); } .tag--coral { --t: var(--c-coral); } .tag--blue { --t: var(--c-blue); } .tag--mint { --t: var(--c-mint); } .tag--amber { --t: #a86400; } .tag--neutral { --t: var(--ink-2); }
.badge { --b: var(--st-discussion); --bg: var(--st-discussion-bg); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; font-size: var(--step--2); font-weight: 600; line-height: 1; padding: 5px 11px 5px 8px; border-radius: 999px; color: var(--b); background: var(--bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--b) 22%, transparent); }
.badge svg { width: 15px; height: 15px; flex: none; }
.badge--merged { --b: var(--st-merged); --bg: var(--st-merged-bg); }
.badge--closed { --b: var(--st-closed); --bg: var(--sheet); box-shadow: inset 0 0 0 1px var(--rule-strong); }

/* ---------- Section heads, cards, grids ---------- */
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--s2) var(--s4); margin-bottom: var(--head-gap); }
.head-row p { color: var(--ink-2); margin-top: 8px; max-width: 60ch; }
.head-center { display: grid; justify-items: center; gap: 16px; text-align: center; margin-bottom: var(--head-gap); }
.head-center h2 { font-size: var(--fs-h1); }
.head-center p { color: var(--ink-2); max-width: 54ch; }
.kcard { display: grid; gap: 12px; align-content: start; padding: var(--card-pad); border-radius: 24px; background: var(--sheet); border: 1px solid var(--rule); min-width: 0; }
.kcard-title { font-family: var(--font-display); font-size: var(--step-1); font-weight: 500; line-height: 1.2; }
.kcard-text { color: var(--ink-2); }
.g2, .g3 { list-style: none; display: grid; gap: var(--grid-gap); }
.g2 > li, .g3 > li { display: flex; min-width: 0; } .g2 > li > *, .g3 > li > * { width: 100%; }
@media (min-width: 760px) { .g2, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 960px) { .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.sky-frame { background: var(--c-sky); background-image: radial-gradient(#c4d8f5 1.4px, transparent 1.4px); background-size: 26px 26px; }
.stack { display: grid; gap: var(--grid-gap); }
.stack > * { min-width: 0; }
.stack + .stack { margin-top: var(--sec-y); }

/* ---------- Overview rows (zig-zag) ---------- */
.zig { display: grid; gap: var(--head-gap); align-items: center; }
.zig + .zig { margin-top: var(--sec-y); }
.zig-text { display: grid; gap: var(--s2); justify-items: start; min-width: 0; }
.zig-tags { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.zig-text h3 { font-size: var(--fs-h2); letter-spacing: -0.02em; line-height: 1.12; }
.zig-result { display: flex; align-items: baseline; gap: 14px; color: var(--ink-2); }
.zig-result .big { font-family: var(--font-display); font-size: var(--step-6); line-height: 1; letter-spacing: -0.05em; color: var(--c-blue); flex: none; }
.zig-verdict { color: var(--ink-2); max-width: 48ch; }
.zig-text .cta { margin-top: var(--s1); }
.zig-chart { padding: var(--card-pad); border-radius: 24px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: 0 30px 60px -40px rgba(14, 23, 38, 0.55); min-width: 0; }
@media (min-width: 960px) { .zig { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: var(--s8); } .zig--rev .zig-text { order: 2; } }

/* ---------- Experiment page ---------- */
.verdict { display: grid; gap: var(--grid-gap); }
.verdict > * { min-width: 0; }
.v-main h2 { font-size: var(--fs-h2); }
.v-main h3, .v-chart h3 { margin-top: 8px; }
.v-lead { font-size: var(--step-1); line-height: 1.5; color: var(--ink); max-width: var(--measure); padding-left: 16px; border-left: 3px solid var(--c-blue); }
@media (min-width: 960px) { .verdict { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } .facts dd { margin-bottom: 10px; } }
.plain { padding-left: 20px; color: var(--ink-2); display: grid; gap: 6px; }

.machines-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--s2); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--fill); border: 1px solid var(--rule); }
.seg button { font: inherit; font-size: var(--step--1); font-weight: 500; min-height: 40px; padding: 0 14px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); cursor: pointer; transition: background-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(14, 23, 38, 0.12), 0 0 0 1px var(--rule); }

.bars { display: grid; gap: var(--s3); }
.bar-row { display: grid; gap: 8px; }
.bar-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px var(--s2); font-size: var(--step--1); color: var(--ink-2); }
.bar-head .v { font-weight: 600; color: var(--ink); white-space: nowrap; }
.bar-track { height: 12px; border-radius: 999px; background: var(--fill); position: relative; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--c-blue-mid); transform-origin: left; }
.bar-fill--after { background: var(--c-blue); }
.bar-range { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px solid var(--muted); border-right: 1.5px solid var(--muted); }
.bar-range::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid var(--muted); opacity: 0.6; }
.stamp { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--c-coral-soft); color: var(--c-coral-ink); font-size: var(--step--2); font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c-coral-ink) 22%, transparent); }
.stamp svg { width: 15px; height: 15px; }

.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 24px; padding: 4px var(--card-pad); }
table { width: 100%; border-collapse: collapse; font-size: var(--step--1); line-height: 1.5; }
th, td { text-align: left; padding: 14px 18px 14px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
tr:last-child td { border-bottom: 0; }

td { color: var(--ink-2); }
th.n, td.n { text-align: right; white-space: nowrap; }
td.n { font-family: var(--font-mono); font-size: 0.875rem; color: var(--ink); }
td .range, th .range { display: block; font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
td:first-child { min-width: 14ch; }
td.fail { color: var(--c-coral-ink); font-weight: 600; }

.code { display: flex; align-items: stretch; border-radius: 24px; background: #0f1b2e; box-shadow: 0 30px 60px -40px rgba(14, 23, 38, 0.6); overflow: hidden; }
.code code { flex: 1; min-width: 0; padding: var(--card-pad); color: #dbe6f6; font-size: var(--step--1); line-height: 1.6; overflow-x: auto; white-space: pre; }
.code code::before { content: "$ "; color: #5d7396; }
.copy { flex: none; align-self: center; margin-right: 14px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid #2b3f5e; border-radius: var(--r-ctl); background: #16253d; color: #dbe6f6; font: inherit; font-size: var(--step--1); font-weight: 500; cursor: pointer; transition: background-color var(--t-fast), border-color var(--t-fast); }
.copy:hover { background: #1f3352; border-color: #3d5a85; }
.copy svg { width: 16px; height: 16px; }

/* ---------- Vertical grouped bar chart with the change per group ---------- */
.bc { margin: 0; display: grid; gap: 16px; }
.bc-plot { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s3); height: 290px; padding-top: 92px; border-bottom: 2px solid var(--c-ink); background: repeating-linear-gradient(to top, transparent 0 48px, #e3e9f0 48px 49px); background-clip: content-box; }
.bc-group { position: relative; display: grid; }
.bc-bars { display: flex; align-items: flex-end; justify-content: center; gap: 12px; height: 100%; }
.bc-bar { position: relative; width: min(64px, 42%); height: var(--h); display: flex; flex-direction: column; justify-content: flex-end; }
.bc-fill { flex: 1; border-radius: 12px 12px 3px 3px; transform-origin: bottom; }
.bc-bar--before .bc-fill { background: linear-gradient(to top, #4f84d1, #8db3ea); }
.bc-bar--after .bc-fill { background: linear-gradient(to top, #174d96, #2f74d0); box-shadow: 0 10px 24px -10px rgba(29, 95, 184, 0.8); }
.bc-val { position: absolute; bottom: calc(100% + 8px); left: 50%; translate: -50% 0; white-space: nowrap; padding: 3px 7px; border-radius: 6px; background: var(--sheet); box-shadow: 0 0 0 1px var(--rule); font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--ink); }
.bc-delta { position: absolute; top: -88px; left: 50%; translate: -50% 0; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--st-merged-bg); color: var(--st-merged); font-weight: 700; font-size: var(--step--1); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st-merged) 25%, transparent); }
.bc-delta svg { width: 15px; height: 15px; }
.bc-glabel { position: absolute; top: calc(100% + 12px); left: 0; right: 0; text-align: center; font-size: var(--step--1); font-weight: 600; color: var(--ink-2); line-height: 1.3; }
.bc-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 40px; font-size: var(--step--1); color: var(--ink-2); }
.bc-legend span { display: inline-flex; align-items: center; gap: 8px; }
.bc-key { width: 14px; height: 14px; border-radius: 4px; }
.bc-key--before { background: var(--c-blue-mid); } .bc-key--after { background: var(--c-blue); }
.bc-note { color: var(--muted); }

/* ---------- Footer ---------- */
.footer { border-top: 1px solid var(--rule); margin-top: var(--s5); }
.footer .wrap { padding-top: var(--s5); padding-bottom: var(--s6); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s3); }
.footer p { max-width: 60ch; color: var(--ink-2); font-size: var(--step--1); }
.footer-nav { list-style: none; display: flex; flex-wrap: wrap; gap: 4px var(--s3); }
.footer-nav a { display: inline-flex; min-height: 44px; align-items: center; font-size: var(--step--1); color: var(--ink-2); }
.footer-nav a:hover { color: var(--accent); }
.empty { padding: var(--card-pad); border: 1px dashed var(--rule-strong); border-radius: 24px; color: var(--ink-2); background: var(--sheet); }

/* ---------- Motion ---------- */
.js .hero-text > *, .js .hero-fig { animation: rise 0.7s var(--ease-out) both; }
.js .hero-text > :nth-child(2) { animation-delay: 100ms; } .js .hero-text > :nth-child(3) { animation-delay: 200ms; } .js .hero-fig { animation-delay: 150ms; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.js [data-reveal] { opacity: 0; transform: translateY(16px); transition: opacity 520ms var(--ease-out), transform 520ms var(--ease-out); }
.js [data-reveal][data-shown] { opacity: 1; transform: none; }
.js .bars .bar-fill { transform: scaleX(0); transition: transform 0.9s var(--ease); }
.js .bars[data-drawn] .bar-fill { transform: none; }
.js .bc .bc-fill { transform: scaleY(0); transition: transform 0.9s cubic-bezier(0.34, 1.25, 0.64, 1) calc(var(--i) * 120ms); }
.js .bc .bc-val { opacity: 0; transition: opacity 0.4s calc(var(--i) * 120ms + 600ms); }
.js .bc .bc-delta { opacity: 0; transform: translateY(6px) scale(0.9); transition: opacity 0.4s, transform 0.5s cubic-bezier(0.34, 1.5, 0.64, 1); transition-delay: calc(var(--g) * 240ms + 900ms); }
.js .bc[data-drawn] .bc-fill { transform: none; }
.js .bc[data-drawn] .bc-val { opacity: 1; }
.js .bc[data-drawn] .bc-delta { opacity: 1; transform: none; }
.js [data-reveal] .g2 > li, .js [data-reveal] .g3 > li { opacity: 0; translate: 0 24px; transition: opacity 0.6s var(--ease-out), translate 0.6s var(--ease-out); transition-delay: calc(var(--i, 0) * 110ms); }
.js [data-reveal][data-shown] .g2 > li, .js [data-reveal][data-shown] .g3 > li { opacity: 1; translate: 0 0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .js [data-reveal], .js [data-reveal] li { opacity: 1 !important; transform: none !important; translate: none !important; }
  .js .bar-fill, .js .bc-fill { transform: none !important; }
  .js .bc-val, .js .bc-delta { opacity: 1 !important; transform: none !important; }
}
@media (max-width: 560px) {
  .bc-plot { gap: var(--s1); }
  .bc-bars { gap: 6px; }
  .bc-val { font-size: 11px; padding: 2px 5px; }
  .code { flex-direction: column; }
  .copy { align-self: flex-start; margin: 0 0 14px var(--card-pad); }
}

<script>
const REPO = "https://github.com/MartinFerret/typescript-performance-lab";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const plain = (s) => String(s ?? "").replace(/`/g, "");
const vers = (s) => esc(s).replace(/(\d+\.\d+\.\d+)/g, '<span class="ver">$1</span>');
const median = (a) => { const b = [...a].sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const fmtS = (v) => v == null ? "n/a" : (v < 1 ? v.toFixed(3) : v < 10 ? v.toFixed(2) : v.toFixed(1)) + " s";
const fmtN = (v) => v == null ? "n/a" : Math.round(v).toLocaleString("en-US");
const fmtMB = (kb) => kb == null ? "n/a" : (kb / 1024 >= 1024 ? (kb / 1048576).toFixed(1) + " GB" : Math.round(kb / 1024) + " MB");
const date = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
/* "2026-10" -> "October 2026", "2026-10-02" -> "2 October 2026". */
const openedText = (o) => /^\d{4}-\d{2}$/.test(o) ? new Date(`${o}-01T12:00:00Z`).toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : date(o);
const cpuShort = (cpu) => cpu.replace(/\(R\)|Processor.*$|@.*$/g, "").replace(/\s+/g, " ").trim();
const envText = (e) => `${e.cpu.replace(/\(R\)/g, "").replace(/\s+/g, " ")}, ${e.cores} ${e.cores > 1 ? "cores" : "core"}, ${e.memoryGB} GB RAM, ${e.platform}, Node.js ${e.node}`;
const envShort = (e) => `${cpuShort(e.cpu)}, ${e.cores} ${e.cores > 1 ? "cores" : "core"}, ${e.memoryGB} GB`;
/* Sessions newest first. */
const sessionsOf = (e) => (e.sessions ?? []).slice().sort((a, b) => b.date.localeCompare(a.date));

const svg = (paths, vb = "0 0 20 20", sw = 1.8) => `<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICON = {
  lab: '<path d="M8 3h4M9 3v5l-4.5 7.5A1.5 1.5 0 0 0 5.8 18h8.4a1.5 1.5 0 0 0 1.3-2.5L11 8V3"/><path d="M6.5 13h7"/>',
  confirmed: '<circle cx="10" cy="10" r="7"/><path d="m6.5 10 2.5 2.5 4.5-5"/>',
  rejected: '<circle cx="10" cy="10" r="7"/><path d="m7 7 6 6M13 7l-6 6"/>',
  open: '<circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 2.8 1.8c-.6.3-.8.7-.8 1.2"/><circle cx="10" cy="13.6" r=".6" fill="currentColor"/>',
  warn: '<path d="M10 3 2.5 16.5h15z"/><path d="M10 8.5v3.5M10 14.3v.2"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  copy: '<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>',
  down: '<path d="M8 3v10m-4-4 4 4 4-4"/>',
};
const arrow = svg(ICON.arrow, "0 0 24 24", 2);
const tag = (label, tone = "violet", icon = svg(ICON.lab)) => `<span class="tag tag--${tone}"><span class="tag-ic" aria-hidden="true">${icon}</span><span>${label}</span></span>`;
const STATUS = { confirmed: ["Confirmed", "merged"], rejected: ["Rejected", "closed"], open: ["Open question", "discussion"] };
const badge = (status) => { const [label, v] = STATUS[status] ?? [status, "discussion"]; return `<span class="badge badge--${v}">${svg(ICON[status] ?? ICON.open)}${esc(label)}</span>`; };
const copyLabel = `${svg(ICON.copy)}<span>Copy</span>`;
const codeBlock = (cmd) => `<div class="code"><code>${esc(cmd)}</code><button class="copy" type="button" data-copy="${esc(cmd)}">${copyLabel}</button></div>`;

/* Medians recomputed from the raw runs. Memory: rss = peak RSS from /usr/bin/time (MiB), reported = the compiler's own "Memory used" line (KiB). */
function stats(c) {
  const r = c.runs || []; if (!r.length) return null;
  const pick = (k) => r.map((x) => x[k]).filter((v) => v != null);
  const ck = pick("checkTime"), tt = pick("totalTime"), rss = pick("maxRssMB"), rep = pick("memoryUsedKB");
  const same = (k) => new Set(r.map((x) => x[k])).size <= 1;
  return { n: r.length, check: median(ck), checkMin: Math.min(...ck), checkMax: Math.max(...ck), total: median(tt),
    rss: rss.length ? median(rss) : null, reported: rep.length ? median(rep) : null,
    instantiations: median(pick("instantiations")), types: median(pick("types")), files: median(pick("files")),
    stable: same("files") && same("types") && same("instantiations") };
}
const fmtMiB = (mib) => mib == null ? "n/a" : mib >= 1024 ? `${(mib / 1024).toFixed(1)} GiB` : `${Math.round(mib)} MiB`;
const fmtKiB = (kib) => kib == null ? "n/a" : fmtMiB(kib / 1024);
/* Why a condition failed, from what the run recorded. Never the machine's RAM unless the run says so. */
function failLabel(c, s) {
  if (c.status !== "out-of-memory") return "Did not finish";
  const f = c.failure;
  if (f?.cause === "v8-heap-limit") {
    const custom = c.env?.NODE_OPTIONS?.match(/--max-old-space-size=(\d+)/)?.[1];
    const lim = custom ? `${Number(custom) / 1024} GiB` : s.protocol?.heapLimitBytes ? `${(s.protocol.heapLimitBytes / 2 ** 30).toFixed(1)} GiB` : null;
    return `Out of memory at Node.js's ${custom ? "" : "default "}heap limit${lim ? ` (${lim})` : ""}`;
  }
  return "Out of memory (cause not recorded)";
}
const check = (s, key) => { const c = s.conditions.find((x) => x.key === key); return c && c.status === "ok" ? stats(c)?.check : undefined; };

/* Headline result from the newest session, never typed by hand. */
function headline(e) {
  const s = sessionsOf(e)[0]; if (!s) return null;
  const b7 = check(s, "before-ts7"), a7 = check(s, "after-ts7");
  if (b7 && a7) return { value: `−${Math.round((1 - a7 / b7) * 100)}%`, label: "check time with TypeScript 7 after the fix", s };
  const six = check(s, "src-ts6"), seven = check(s, "src-ts7");
  if (six && seven) return { value: `${(six / seven).toFixed(1)}×`, label: "faster check of the sources, TypeScript 7 vs 6", s };
  return null;
}

/* Summary chart: before/after per compiler on the newest machine, or TS 6 vs 7 per machine. */
function chartGroups(e) {
  const sessions = sessionsOf(e), s = sessions[0];
  if (!s) return { groups: [], delta: "percent" };
  const versions = [...new Set(s.conditions.map((c) => c.key.match(/^(?:before|after)-ts(\d+)$/)?.[1]).filter(Boolean))];
  if (versions.length) {
    const groups = versions.map((v) => ({ label: `TypeScript ${v}`, bars: [
      { label: "Before the fix", value: check(s, `before-ts${v}`), tone: "before" },
      { label: "After the fix", value: check(s, `after-ts${v}`), tone: "after" },
    ] })).filter((g) => g.bars.every((b) => b.value));
    return { groups, delta: "percent", caption: `${envShort(s.environment)}, ${date(s.date)}` };
  }
  const groups = sessions.slice().reverse().map((x) => ({ label: cpuShort(x.environment.cpu), bars: [
    { label: "TypeScript 6", value: check(x, "src-ts6"), tone: "before" },
    { label: "TypeScript 7", value: check(x, "src-ts7"), tone: "after" },
  ] })).filter((g) => g.bars.every((b) => b.value));
  return { groups, delta: "times", caption: "Library sources, one group per machine" };
}

function barChart({ groups, delta, caption }, label) {
  if (!groups.length) return "";
  const max = Math.max(...groups.flatMap((g) => g.bars.map((b) => b.value)));
  const change = (g) => { const [a, b] = g.bars.map((x) => x.value); return delta === "times" ? `${(a / b).toFixed(1)}× faster` : `−${Math.round((1 - b / a) * 100)}%`; };
  const aria = `${label}. ${groups.map((g) => `${g.label}: ${g.bars.map((b) => `${b.label} ${fmtS(b.value)}`).join(", ")}, ${change(g)}`).join(". ")}.`;
  const legend = [...new Map(groups.flatMap((g) => g.bars).map((b) => [b.tone, b.label])).entries()];
  return `<figure class="bc" data-observe>
    <div class="bc-plot" role="img" aria-label="${esc(aria)}">
      ${groups.map((g, gi) => `<div class="bc-group" style="--g:${gi}">
        <span class="bc-delta">${svg(ICON.down, "0 0 16 16", 2)}${change(g)}</span>
        <div class="bc-bars">${g.bars.map((b, bi) => `<div class="bc-bar bc-bar--${b.tone}" style="--h:${Math.max(2, (b.value / max) * 100)}%;--i:${gi * 2 + bi}"><span class="bc-val">${fmtS(b.value)}</span><span class="bc-fill"></span></div>`).join("")}</div>
        <span class="bc-glabel">${esc(g.label)}</span>
      </div>`).join("")}
    </div>
    <figcaption class="bc-legend">${legend.map(([tone, l]) => `<span><i class="bc-key bc-key--${tone}"></i>${esc(l)}</span>`).join("")}<span class="bc-note">Median check time, lower is faster${caption ? `. ${esc(caption)}` : ""}</span></figcaption>
  </figure>`;
}

const hero = ({ crumb = "", title, sub = "", actions = "", fig = "" }) => `
  <section class="frame hero-panel" aria-labelledby="page-title">
    <div class="wrap hero${fig ? "" : " hero--solo"}">

/* ---------- Overview hero: a replay of the measured check, file by file ---------- */
function raceData(ex) {
  // The source-check comparison of the newest TS 6 vs TS 7 session, else the newest before/after pair.
  for (const e of ex.slice().sort((a, b) => b.id.localeCompare(a.id))) {
    const s = sessionsOf(e)[0]; if (!s) continue;
    const pairs = [["src-ts6", "src-ts7", "TypeScript", "TypeScript", "type-fest"], ["before-ts7", "after-ts7", "Before the fix,", "After the fix,", "typed events"]];
    for (const [ka, kb, la, lb, what] of pairs) {
      const ca = s.conditions.find((c) => c.key === ka), cb = s.conditions.find((c) => c.key === kb);
      const a = ca && ca.status === "ok" && stats(ca), b = cb && cb.status === "ok" && stats(cb);
      const ver = (c) => c.compiler.match(/\d+\.\d+\.\d+/)?.[0] ?? "";
      if (a && b) return { e, s, what, files: Math.round(a.files), a: { label: la, ver: ver(ca), t: a.check }, b: { label: lb, ver: ver(cb), t: b.check } };
    }
  }
  return null;
}

const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let raceFrame = 0;
function playRace(root) {
  if (!root) return;
  cancelAnimationFrame(raceFrame);
  const runs = $$(".run", root).map((el) => {
    const cells = $$(".files i", el);
    // A fixed pseudo-random order, so the files light up scattered rather than row by row.
    const order = cells.map((_, i) => i);
    let seed = 20261110; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return { el, t: +el.dataset.t, cells, order, lit: 0, time: $(".run-time", el), count: $("[data-count]", el), state: $("[data-state-label]", el) };
  });
  const max = Math.max(...runs.map((r) => r.t));
  const DURATION = 3800; // ms of animation for the slower compiler
  root.removeAttribute("data-finished");
  for (const r of runs) { r.cells.forEach((c) => c.classList.remove("on", "hot")); r.lit = 0; r.el.dataset.state = "waiting"; r.state.textContent = "waiting"; }
  const draw = (sim) => {
    for (const r of runs) {
      const p = Math.min(1, sim / r.t), want = Math.round(p * r.cells.length);
      $$(".hot", r.el).forEach((c) => c.classList.remove("hot"));
      while (r.lit < want) r.cells[r.order[r.lit++]].classList.add("on");
      if (p < 1 && r.lit) for (let k = 1; k <= Math.min(3, r.lit); k++) r.cells[r.order[r.lit - k]].classList.add("hot");
      r.time.textContent = fmtS(Math.min(sim, r.t));
      r.count.textContent = `${r.lit} / ${r.cells.length} files`;
      const st = p >= 1 ? "done" : sim > 0 ? "running" : "waiting";
      if (r.el.dataset.state !== st) { r.el.dataset.state = st; r.state.textContent = st === "done" ? "checked" : st === "running" ? "checking" : "waiting"; }
    }
  };
  if (reduced()) { draw(max); root.setAttribute("data-finished", ""); return; }
  const start = performance.now() + 500;
  const tick = (now) => {
    const sim = Math.max(0, (now - start) / DURATION) * max;
    draw(sim);
    if (sim < max) raceFrame = requestAnimationFrame(tick);
    else root.setAttribute("data-finished", "");
  };
  draw(0);
  raceFrame = requestAnimationFrame(tick);
}

function initHero() {
  const race = $("[data-race]");
  if (!race) return;
  if ("IntersectionObserver" in window) {
    const o = new IntersectionObserver((en) => { if (en.some((x) => x.isIntersecting)) { playRace(race); o.disconnect(); } }, { threshold: 0.35 });
    o.observe(race);
  } else playRace(race);
}

let DATA, sessionIdx = {};
const SCOPE = { before: "", after: "", sources: "Library sources", checkers: "TypeScript 7 checker count (separate series)", full: "Full suite with type tests" };
function decompositionCard(e, s) {
  const m = (e.analysis ?? []).find((x) => x.machine.cpu === s.environment.cpu && x.machine.cores === s.environment.cores);
  const d = m?.decomposition; if (!d) return "";
  const row = (name, k, what) => `<tr><td>${name}<span class="range">${what}</span></td><td class="n">${d[k].value.toFixed(1)}×<span class="range">${d[k].low.toFixed(2)} to ${d[k].high.toFixed(2)}</span></td></tr>`;
  return `<div class="kcard">

}

function resultsBlock(e, sessions, si) {

  const groups = [];

  const bars = groups.map((g) => {

  const unstable = rows.filter((r) => r.s && !r.s.stable).map((r) => r.c.label);

}

        <h2 id="setup">Setup</h2>
        <dl class="facts">
          ${target ? `<dt>Target</dt><dd><a class="link" href="${esc(target.repository)}">${esc(target.name)}</a> at commit <span class="ver">${esc((target.commit || "").slice(0, 7))}</span></dd>` : `<dt>Target</dt><dd>Code in <code>experiments/${esc(e.folder)}</code></dd>`}
          ${e.opened ? `<dt>Opened</dt><dd>${openedText(e.opened)}</dd>` : ""}
          <dt>Command</dt><dd><code>tsc --extendedDiagnostics</code>${s.protocol ? `, ${s.protocol.warmupDiscarded ? "one discarded warm-up run per condition, " : ""}${s.protocol.interleaved ? "conditions interleaved (A B C A B C)" : "runs in sequence"}` : `, ${s.runsPerCondition} runs per condition, no warm-up, runs in sequence`}</dd>
          ${s.protocol?.series?.[0]?.powerBefore ? (() => { const ps = s.protocol.series.flatMap((x) => [x.powerBefore, x.powerAfter]).filter(Boolean); const src = [...new Set(ps.map((p) => p.source))].join(", "); const loads = ps.map((p) => p.loadAverage[0]); return `<dt>Power</dt><dd>${esc(src === "AC" ? "AC power" : src)}, Low Power Mode ${ps.some((p) => p.lowPowerMode) ? "on" : "off"}, load average ${Math.min(...loads).toFixed(1)} to ${Math.max(...loads).toFixed(1)}</dd>`; })() : ""}
          <dt>Machine</dt><dd>${esc(envText(s.environment))}</dd>
          ${s.safetyCheck ? `<dt>Type safety</dt><dd>${s.safetyCheck === "passed" ? `<span class="ok-line">${svg(ICON.confirmed)}Safety check passed: invalid usages still fail to compile.</span>` : esc(s.safetyCheck)}</dd>` : ""}
        </dl>
      </div>
      <div class="kcard">
        <h3>Conditions</h3>
        <ul class="plain">${s.conditions.map((c) => `<li>${vers(c.label)}${c.flags && c.flags.length ? ` with <code>${esc(c.flags.join(" "))}</code>` : ""}${c.env?.NODE_OPTIONS ? ` with <code>NODE_OPTIONS=${esc(c.env.NODE_OPTIONS)}</code>` : ""}${c.runs?.length ? `, ${c.runs.length} ${c.runs.length === 1 ? "run" : "runs"}` : ""}</li>`).join("")}</ul>
      </div>
    </div>
  </section>
  <section class="wrap block stack" aria-labelledby="results" data-reveal data-results>${resultsBlock(e, sessions, si)}</section>` : `<section class="wrap block"><p class="empty">Not measured yet. Run the command below to add the first results.</p></section>`}
  <section class="wrap block" aria-labelledby="limits" data-reveal>
    <div class="kcard">
      <h2 id="limits">Limits</h2>
      ${(e.notes || []).map((n) => `<p class="v-note"><b>Note</b>${md(n)}</p>`).join("")}
      <ul class="plain read"><li>Results come from one machine per session: compare conditions within the same machine only.</li></ul>
    </div>
  </section>
  <section class="frame sky-frame" id="reproduce" aria-labelledby="repro-title" data-reveal>
    <div class="wrap stack">
      <div class="head-row" style="margin-bottom:0">
        <div><h2 id="repro-title">Reproduce it</h2><p>Node.js 22 or later and git. Results are saved in <code>experiments/${esc(e.folder)}/results/</code>. Open a pull request with yours to add a new machine.</p></div>
        <a class="cta cta--primary" href="${REPO}/tree/main/experiments/${esc(e.folder)}">Source and raw results ${arrow}</a>
      </div>
      ${codeBlock(e.reproduce)}
    </div>
  </section>`;
}

/* ---------- Reveal on scroll, draw charts once ---------- */
const io = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (!en.isIntersecting) continue;
    en.target.setAttribute(en.target.hasAttribute("data-observe") ? "data-drawn" : "data-shown", "");
    io.unobserve(en.target);
  }
}, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }) : null;
function observe(root = document) {
  for (const n of $$("[data-reveal]:not([data-shown]), [data-observe]:not([data-drawn])", root)) {
    if (io) io.observe(n); else n.setAttribute(n.hasAttribute("data-observe") ? "data-drawn" : "data-shown", "");
  }
}

/* ---------- Router ---------- */
const VIEWS = new Set(["", "method"]);
function render() {
  const id = location.hash.slice(1);
  const e = DATA.experiments.find((x) => x.id === id);
  if (!e && !VIEWS.has(id)) return; // an in-page anchor such as #results: let the browser scroll
  $("#main").innerHTML = id === "method" ? method() : e ? experiment(e) : home();
  document.title = (e ? `#${e.id} ${plain(e.title)}, ` : id === "method" ? "Method, " : "") + "TypeScript Performance Lab";
  $$("#nav a").forEach((a) => { if (a.getAttribute("href") === `#${id}`) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (id) $("#main").focus({ preventScroll: true });
  window.scrollTo(0, 0);
  observe();
  if (!id) initHero();
}
document.addEventListener("click", (ev) => {
  const c = ev.target.closest(".copy");
  if (c) {
    navigator.clipboard?.writeText(c.dataset.copy);
    c.innerHTML = `${svg(ICON.confirmed)}<span>Copied</span>`;
    setTimeout(() => (c.innerHTML = copyLabel), 1500);
    return;
  }
  if (ev.target.closest("[data-replay]")) { playRace($("[data-race]")); return; }
  const a = ev.target.closest("a[data-scroll]");
  if (a) { ev.preventDefault(); document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  const b = ev.target.closest(".seg button");
  if (b) {
    const e = DATA.experiments.find((x) => x.id === location.hash.slice(1));
    if (!e) return;
    sessionIdx[e.id] = +b.dataset.s;
    const box = $("[data-results]");
    box.innerHTML = resultsBlock(e, sessionsOf(e), sessionIdx[e.id]);
    observe(box);
    $(`.seg button[data-s="${b.dataset.s}"]`, box)?.focus();
  }
});
fetch("data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  DATA = d;
  $("#nav").innerHTML = `<li><a href="#">Overview</a></li>` +
    d.experiments.map((e) => `<li><a href="#${esc(e.id)}" title="${esc(plain(e.title))}">Lab #${esc(e.id)}</a></li>`).join("") +
    `<li><a href="#method">Method</a></li>`;
  addEventListener("hashchange", render);
  render();
}).catch(() => {
  $("#main").innerHTML = `<div class="wrap block"><p class="empty">The notebook could not load <code>data.json</code>. Run <code>npm run site</code> from the repository root, then open http://localhost:4173.</p></div>`;
});
</script>
